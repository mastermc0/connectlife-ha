# Uses default mappings
properties:
- property: Selected_program_ID
  select:
    options:
        5: allergy_care
        6: drum_clean
        7: cotton
        8: synthetic
        9: eco_40_60
        10: wool
        11: quick_15
        14: spin
        16: baby_care
        18: sportswear
        19: down
        20: rinse_spin
        24: shirts
        41: power_49
        42: auto
- property: Current_program_phase
  sensor:
    device_class: enum
    options:
      0: not_available
      1: weigh
      2: prewash
      3: wash
      4: rinsing
      7: spinning
      8: drying
      10: finished
      11: delay_start_waiting
- property: ApplicationPermissions
  # 1 = not granted (No remote control allowed), 3 = granted (Remote control allowed) ?
  hide: false
  sensor:
    read_only: true
    device_class: enum
    options:
      0: "disabled"
      1: "enabled"
      2: "not_granted"
      3: "granted"      
